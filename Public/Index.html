<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Asif Store</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f5f5f5;
    color: #111;
}

.header {
    background: #111;
    color: white;
    padding: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 22px;
    font-weight: bold;
}

.cart-btn {
    background: white;
    color: #111;
    border: none;
    padding: 10px 15px;
    border-radius: 8px;
    cursor: pointer;
}

.hero {
    background: linear-gradient(135deg, #111, #444);
    color: white;
    text-align: center;
    padding: 60px 20px;
}

.hero h1 {
    font-size: 35px;
    margin-bottom: 12px;
}

.hero p {
    margin-bottom: 25px;
}

.hero button {
    padding: 13px 25px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

.products-section {
    padding: 30px 15px;
}

.products-section h2 {
    text-align: center;
    margin-bottom: 25px;
}

.products {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.product {
    background: white;
    border-radius: 12px;
    padding: 12px;
    box-shadow: 0 3px 10px #0002;
}

.product img {
    width: 100%;
    height: 160px;
    object-fit: cover;
    border-radius: 8px;
}

.product h3 {
    margin-top: 10px;
}

.price {
    font-weight: bold;
    margin: 8px 0;
}

.add-btn {
    width: 100%;
    padding: 10px;
    background: #111;
    color: white;
    border: none;
    border-radius: 7px;
    cursor: pointer;
}

.add-btn:active,
.checkout-btn:active,
.cart-btn:active {
    transform: scale(0.98);
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: #0008;
    padding: 20px;
    overflow-y: auto;
    z-index: 1000;
}

.cart-box {
    background: white;
    max-width: 500px;
    margin: 40px auto;
    padding: 20px;
    border-radius: 12px;
}

.close {
    float: right;
    border: none;
    background: none;
    font-size: 22px;
    cursor: pointer;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 0;
    border-bottom: 1px solid #ddd;
}

.remove-btn {
    border: none;
    background: none;
    cursor: pointer;
    margin-left: 8px;
}

.checkout-btn {
    width: 100%;
    padding: 13px;
    background: #111;
    color: white;
    border: none;
    border-radius: 8px;
    margin-top: 15px;
    cursor: pointer;
}

#checkoutForm input,
#checkoutForm textarea {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
}

#checkoutForm textarea {
    height: 100px;
}

.empty-cart {
    padding: 20px 0;
    text-align: center;
    color: #666;
}

.success-box {
    margin-top: 20px;
    padding: 15px;
    background: #e8ffe8;
    border-radius: 10px;
}

.error-box {
    margin-top: 20px;
    padding: 15px;
    background: #ffe8e8;
    border-radius: 10px;
}

.loading {
    opacity: 0.7;
    pointer-events: none;
}
</style>
</head>

<body>

<header class="header">

    <div class="logo">
        ASIF STORE
    </div>

    <button class="cart-btn" onclick="openCart()">
        🛒 Cart (<span id="cartCount">0</span>)
    </button>

</header>

<section class="hero">

    <h1>Welcome to Asif Store</h1>

    <p>Shop your favourite products online</p>

    <button onclick="scrollToProducts()">
        Shop Now
    </button>

</section>

<section class="products-section" id="productsSection">

    <h2>Our Products</h2>

    <div id="products" class="products"></div>

</section>


<!-- CART -->

<div id="cartModal" class="modal">

    <div class="cart-box">

        <button class="close" onclick="closeCart()">✕</button>

        <h2>Your Cart</h2>

        <div id="cartItems"></div>

        <h3>
            Total: Rs. <span id="cartTotal">0</span>
        </h3>

        <button
            id="checkoutButton"
            class="checkout-btn"
            onclick="checkout()">

            Checkout

        </button>

    </div>

</div>


<!-- CHECKOUT -->

<div id="checkoutModal" class="modal">

    <div class="cart-box">

        <button class="close" onclick="closeCheckout()">
            ✕
        </button>

        <h2>Checkout</h2>

        <form id="checkoutForm">

            <input
                type="text"
                id="customerName"
                placeholder="Full Name"
                required
            >

            <input
                type="tel"
                id="customerPhone"
                placeholder="Phone Number"
                required
            >

            <textarea
                id="customerAddress"
                placeholder="Complete Delivery Address"
                required
            ></textarea>

            <button
                type="submit"
                id="placeOrderButton"
                class="checkout-btn">

                Place Order

            </button>

        </form>

        <div id="orderSuccess"></div>

    </div>

</div>


<script>

const products = [

    {
        id: 1,
        name: "Premium Perfume",
        price: 2500,
        image: "https://images.unsplash.com/photo-1541643600914-78b084683601"
    },

    {
        id: 2,
        name: "Smart Watch",
        price: 4500,
        image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30"
    },

    {
        id: 3,
        name: "Wireless Headphones",
        price: 3500,
        image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e"
    },

    {
        id: 4,
        name: "Mobile Accessories",
        price: 1500,
        image: "https://images.unsplash.com/photo-1601784551446-20c9e07cdbdb"
    }

];

let cart = [];


function showProducts() {

    const container = document.getElementById("products");

    container.innerHTML = "";

    products.forEach(product => {

        container.innerHTML += `
            <div class="product">

                <img
                    src="${product.image}"
                    alt="${product.name}"
                >

                <h3>${product.name}</h3>

                <div class="price">
                    Rs. ${product.price}
                </div>

                <button
                    class="add-btn"
                    onclick="addToCart(${product.id})">

                    Add to Cart

                </button>

            </div>
        `;

    });

}


function addToCart(id) {

    const product = products.find(p => p.id === id);

    if (!product) {
        return;
    }

    cart.push(product);

    updateCart();

}


function updateCart() {

    document.getElementById("cartCount").innerText = cart.length;

    const items = document.getElementById("cartItems");

    items.innerHTML = "";

    let total = 0;

    if (cart.length === 0) {

        items.innerHTML = `
            <div class="empty-cart">
                Your cart is empty.
            </div>
        `;

    }

    cart.forEach((item, index) => {

        total += item.price;

        items.innerHTML += `
            <div class="cart-item">

                <span>
                    ${item.name}
                </span>

                <span>
                    Rs. ${item.price}

                    <button
                        class="remove-btn"
                        onclick="removeItem(${index})">

                        ❌

                    </button>
                </span>

            </div>
        `;

    });

    document.getElementById("cartTotal").innerText = total;

}


function removeItem(index) {

    cart.splice(index, 1);

    updateCart();

}


function openCart() {

    document.getElementById("cartModal").style.display = "block";

    updateCart();

}


function closeCart() {

    document.getElementById("cartModal").style.display = "none";

}


function checkout() {

    if (cart.length === 0) {

        alert("Cart is empty");

        return;

    }

    closeCart();

    document.getElementById("checkoutModal").style.display = "block";

}


function closeCheckout() {

    document.getElementById("checkoutModal").style.display = "none";

}


/* =========================
   SAVE ORDER TO D1 DATABASE
========================= */

document
    .getElementById("checkoutForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        if (cart.length === 0) {

            alert("Cart is empty");

            return;

        }

        const name =
            document.getElementById("customerName").value.trim();

        const phone =
            document.getElementById("customerPhone").value.trim();

        const address =
            document.getElementById("customerAddress").value.trim();

        let total = 0;

        cart.forEach(function(item) {

            total += item.price;

        });


        const button =
            document.getElementById("placeOrderButton");

        const successBox =
            document.getElementById("orderSuccess");


        button.innerText = "Saving Order...";

        button.disabled = true;

        successBox.innerHTML = "";


        try {

            const response = await fetch("/api/order", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    name: name,

                    phone: phone,

                    address: address,

                    items: cart,

                    total: total

                })

            });


            const result = await response.json();


            if (!response.ok || !result.success) {

                throw new Error(
                    result.message || "Order could not be saved."
                );

            }


            successBox.innerHTML = `

                <div class="success-box">

                    <h3>✅ Order Placed Successfully!</h3>

                    <p>
                        <b>Order:</b>
                        ${result.orderNumber}
                    </p>

                    <p>
                        <b>Name:</b>
                        ${name}
                    </p>

                    <p>
                        <b>Phone:</b>
                        ${phone}
                    </p>

                    <p>
                        <b>Total:</b>
                        Rs. ${total}
                    </p>

                    <p>
                        Your order has been saved.
                    </p>

                    <p>
                        Thank you for shopping with Asif Store.
                    </p>

                </div>

            `;


            cart = [];

            updateCart();

            document
                .getElementById("checkoutForm")
                .reset();


        } catch (error) {

            console.error(error);

            successBox.innerHTML = `

                <div class="error-box">

                    <h3>❌ Order Save Failed</h3>

                    <p>
                        ${error.message}
                    </p>

                    <p>
                        Please try again.
                    </p>

                </div>

            `;

        } finally {

            button.innerText = "Place Order";

            button.disabled = false;

        }

    });


function scrollToProducts() {

    document
        .getElementById("productsSection")
        .scrollIntoView({
            behavior: "smooth"
        });

}


showProducts();

</script>

</body>
</html>
